name: 构建 iOS 未签名 .ipa

# 手动触发，或推送 ios-v* 标签时自动构建（标签构建会把 ipa 发布到同名 Release，方便匿名下载）
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: write

jobs:
  ipa:
    # 必须用 macOS runner：.ipa 里的 ARM64 二进制只能由 Xcode 工具链编译
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 单文件构建：确保打进 WebView 的是最新版（一跳聚焦 + 节点增删）
      - run: npm run build:single

      - run: npx cap sync ios

      # Capacitor 8 走 Swift Package Manager，先解析本地包再归档
      - name: 解析 Swift Package 依赖
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      # CODE_SIGNING_ALLOWED=NO：runner 上没有证书，只能产出未签名 .app
      - name: 归档（不签名）
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 未签名时 -exportArchive 会失败，改为手工组 Payload 再压缩成 .ipa
      - name: 包装成 .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
                "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry PolytechTree-unsigned.ipa Payload
          ls -lh PolytechTree-unsigned.ipa

      # 标签构建时把 ipa 挂到同名 Release：Release 资源可匿名下载，
      # 不必登录 GitHub 再从 Actions artifacts 里取
      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "$RUNNER_TEMP/ipa/PolytechTree-unsigned.ipa" \
            --title "iOS 未签名包 ${{ github.ref_name }}" \
            --notes "未签名 ipa，需用 Sideloadly 等工具以自备 Apple ID 现签后安装。"

      - uses: actions/upload-artifact@v4
        with:
          name: PolytechTree-ios-unsigned-ipa
          path: ${{ runner.temp }}/ipa/PolytechTree-unsigned.ipa
          if-no-files-found: error
